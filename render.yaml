services:
  - type: web
    name: rentbook-license-server
    runtime: node
    plan: free             # 激活码持久性由 Supabase Postgres 保证（免费档容器无持久盘）
    rootDir: license-server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"           # node:sqlite 本地回退需要 >= 23.4；云库模式用 24 稳妥
      - key: ADMIN_TOKEN
        generateValue: true   # Render 自动生成随机口令，部署后在控制台查看
      - key: DATABASE_URL
        sync: false           # 部署时在 Render 表单填入 Supabase Transaction pooler 连接串（含密码，不入库）
      - key: CREEM_WEBHOOK_SECRET
        generateValue: true   # 同值填到 Creem 后台 webhook 设置
      - key: TRIAL_LIMIT
        value: "3"
      - key: RATE_LIMIT
        value: "60"
